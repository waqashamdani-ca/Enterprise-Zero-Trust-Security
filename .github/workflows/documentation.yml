name: Documentation and repository validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-11-05
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate reports, blank Office templates and publication hygiene
        run: python3 scripts/validate_docs.py
      - name: Validate five blank Office deliverables and approved FWR/FWT subchecks
        run: python3 scripts/validate_office_templates.py
      - name: Install pinned documentation-only libraries
        run: python3 -m pip install -r requirements-docs.txt
      - name: Check document PDFs and deterministic regeneration (docs/reports excluded)
        run: python3 scripts/build_docs.py --check --rebuild-check
      - name: Test PDF generation, Office package safety and report governance
        run: python3 -m unittest discover -s tests -v
      - name: Check whitespace
        run: git show --format= --check HEAD
